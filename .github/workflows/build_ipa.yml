name: Build iOS Game IPA

on:
  workflow_dispatch:
    inputs:
      nsp_download_url:
        description: 'Direct download URL for Base NSP (or zip)'
        required: false
        default: ''
      update_download_url:
        description: 'Direct download URL for Update NSP (optional)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag (optional, e.g. totk-v1.4.3 or v1.0.0)'
        required: false
        default: ''
      release_name:
        description: 'Release title (optional)'
        required: false
        default: ''
      romfs_mode:
        description: 'RomFS packaging: separate (Thin IPA ~100MB) or bundle (Thick IPA ~18GB)'
        required: false
        default: 'separate'
      cache_tag:
        description: 'Shader cache identifier (e.g. totk, bl3, botw, or any game tag)'
        required: false
        default: 'totk'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Free Disk Space
        run: |
          rm -rf /Users/runner/Library/Android || true
          rm -rf /Users/runner/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore Shader Cache
        uses: actions/cache/restore@v4
        with:
          path: shader_cache
          key: shader-cache-${{ github.event.inputs.cache_tag || 'totk' }}-${{ github.run_id }}
          restore-keys: |
            shader-cache-${{ github.event.inputs.cache_tag || 'totk' }}-
            shader-cache-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Homebrew dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Set up Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages nsz lz4 "capstone>=5,<6" fonttools zbic "backports.zstd; python_version < '3.14'"

      - name: Prepare Directories and Keys
        env:
          PROD_KEYS_SECRET: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p input_nsp keys
          if [ -n "$PROD_KEYS_SECRET" ]; then
            echo "$PROD_KEYS_SECRET" > keys/prod.keys
          fi

      - name: Download NSP if URL provided
        run: |
          if [ -n "${{ github.event.inputs.nsp_download_url }}" ]; then
            echo "URL provided, clearing existing input_nsp..."
            rm -rf input_nsp/*
            mkdir -p input_nsp
            URL="${{ github.event.inputs.nsp_download_url }}"
            if [[ "$URL" == *".zip"* ]]; then
              echo "Downloading ZIP: $URL"
              curl --http1.1 --retry 20 --retry-delay 3 --retry-all-errors -L -C - "$URL" -o input_nsp/game.zip
              unzip -q input_nsp/game.zip -d input_nsp/ || true
              rm -f input_nsp/game.zip
            else
              EXT="nsp"
              if [[ "$URL" == *".nsz"* ]]; then EXT="nsz"; fi
              if [[ "$URL" == *".xci"* ]]; then EXT="xci"; fi
              if [[ "$URL" == *".xcz"* ]]; then EXT="xcz"; fi
              echo "Downloading Base package ($EXT): $URL"
              curl --fail --http1.1 --retry 30 --retry-delay 5 --retry-all-errors -L -C - "$URL" -o "input_nsp/base.$EXT"
            fi
          fi
          if [ -n "${{ github.event.inputs.update_download_url }}" ]; then
            U_URL="${{ github.event.inputs.update_download_url }}"
            U_EXT="nsp"
            if [[ "$U_URL" == *".nsz"* ]]; then U_EXT="nsz"; fi
            if [[ "$U_URL" == *".xci"* ]]; then U_EXT="xci"; fi
            if [[ "$U_URL" == *".xcz"* ]]; then U_EXT="xcz"; fi
            echo "Downloading Update package ($U_EXT): $U_URL"
            curl --fail --http1.1 --retry 30 --retry-delay 5 --retry-all-errors -L -C - "$U_URL" -o "input_nsp/update.$U_EXT"
          fi

      - name: Verify Input Files
        run: |
          echo "=== Keys directory ==="
          ls -la keys/ || true
          echo "=== Input NSP directory ==="
          ls -lh input_nsp/ || true

      - name: Inject Shader Cache into Build Directory
        run: |
          if [ -d "shader_cache" ] && [ "$(ls -A shader_cache 2>/dev/null)" ]; then
            echo "=== Found existing shader cache in shader_cache/ ==="
            ls -la shader_cache/
            for d in shader_cache/*_build; do
              [ -d "$d" ] || continue
              bname=$(basename "$d")
              echo "Injecting cached shaders for $bname into input_nsp/$bname/shader..."
              mkdir -p "input_nsp/$bname"
              rm -rf "input_nsp/$bname/shader"
              cp -R "$d/shader" "input_nsp/$bname/" 2>/dev/null || true
            done
          else
            echo "No pre-existing shader cache. Shaders will compile from scratch and be saved."
          fi

      - name: Run build_ipa_from_nsp
        env:
          DM_TEAM_ID: ""
          PYTHONUTF8: "1"
          DMSH_CAS: "${{ github.workspace }}/shader_cache/cas"
        run: |
          ROMFS_OPT="--romfs separate"
          if [ "${{ github.event.inputs.romfs_mode }}" = "bundle" ]; then
            ROMFS_OPT="--romfs bundle"
          fi
          echo "Building with: $ROMFS_OPT"
          python3 scripts/build_ipa_from_nsp.py input_nsp -k keys/prod.keys --no-heap-check --allow-other-metal $ROMFS_OPT

      - name: Harvest Shader Cache
        if: always()
        run: |
          mkdir -p shader_cache
          HAS_CACHE=false
          for d in input_nsp/*_build; do
            [ -d "$d/shader" ] || continue
            bname=$(basename "$d")
            echo "Harvesting $bname/shader into shader_cache/$bname/shader..."
            mkdir -p "shader_cache/$bname"
            rm -rf "shader_cache/$bname/shader"
            cp -R "$d/shader" "shader_cache/$bname/"
            HAS_CACHE=true
          done
          if [ "$HAS_CACHE" = "true" ]; then
            echo "SHADERS_PRESENT=true" >> $GITHUB_ENV
            echo "=== Harvested shader cache ==="
            ls -la shader_cache/
          else
            echo "SHADERS_PRESENT=false" >> $GITHUB_ENV
          fi

      - name: Persist Shader Cache to GitHub
        if: always() && env.SHADERS_PRESENT == 'true'
        uses: actions/cache/save@v4
        with:
          path: shader_cache
          key: shader-cache-${{ github.event.inputs.cache_tag || 'totk' }}-${{ github.run_id }}

      - name: Prepare Release Assets (Split if > 2GB)
        if: success()
        run: |
          for f in input_nsp/*.ipa *.ipa; do
            [ -f "$f" ] || continue
            size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null)
            echo "Checking file $f (size: $size bytes)..."
            if [ "$size" -gt 2000000000 ]; then
              echo "File $f is larger than 2GB ($size bytes), splitting into 1900MB parts..."
              split -b 1900M "$f" "${f}.part"
              rm -f "$f"
              ls -lh "${f}.part"*
            fi
          done

      - name: Create GitHub Release with IPA
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('build-{0}', github.run_number) }}
          TITLE: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || format('Build {0}', github.run_number) }}
        run: |
          echo "Creating or ensuring release $TAG..."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TITLE" --notes "nxnative automated release" || true
          echo "Uploading release assets sequentially..."
          for f in $(ls -1 input_nsp/*.part* input_nsp/*.ipa *.part* *.ipa 2>/dev/null | sort -u); do
            [ -f "$f" ] || continue
            echo "Uploading asset $f..."
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Upload Debug Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            input_nsp/*_build/logs/
            input_nsp/*_build/extract/*/gl_capture/
