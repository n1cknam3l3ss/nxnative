name: Build iOS Game IPA

on:
  workflow_dispatch:
    inputs:
      nsp_download_url:
        description: 'Direct download URL for Base NSP (or zip)'
        required: false
        default: ''
      update_download_url:
        description: 'Direct download URL for Update NSP (optional)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag (optional, e.g. totk-v1.4.3 or v1.0.0)'
        required: false
        default: ''
      release_name:
        description: 'Release title (optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Free Disk Space
        run: |
          rm -rf /Users/runner/Library/Android || true
          rm -rf /Users/runner/hostedtoolcache/CodeQL || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Homebrew dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Set up Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Prepare Directories and Keys
        env:
          PROD_KEYS_SECRET: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p input_nsp keys
          if [ -n "$PROD_KEYS_SECRET" ]; then
            echo "$PROD_KEYS_SECRET" > keys/prod.keys
          fi

      - name: Download NSP if URL provided
        run: |
          if [ -n "${{ github.event.inputs.nsp_download_url }}" ]; then
            echo "URL provided, clearing existing input_nsp..."
            rm -rf input_nsp/*
            mkdir -p input_nsp
            URL="${{ github.event.inputs.nsp_download_url }}"
            if [[ "$URL" == *".zip"* ]]; then
              echo "Downloading ZIP: $URL"
              curl --http1.1 --retry 20 --retry-delay 3 --retry-all-errors -L -C - "$URL" -o input_nsp/game.zip
              unzip -q input_nsp/game.zip -d input_nsp/ || true
              rm -f input_nsp/game.zip
            else
              echo "Downloading Base NSP: $URL"
              curl --http1.1 --retry 20 --retry-delay 3 --retry-all-errors -L -C - "$URL" -o "input_nsp/base.nsp"
            fi
          fi
          if [ -n "${{ github.event.inputs.update_download_url }}" ]; then
            U_URL="${{ github.event.inputs.update_download_url }}"
            echo "Downloading Update NSP: $U_URL"
            curl --http1.1 --retry 20 --retry-delay 3 --retry-all-errors -L -C - "$U_URL" -o "input_nsp/update.nsp"
          fi

      - name: Verify Input Files
        run: |
          echo "=== Keys directory ==="
          ls -la keys/ || true
          echo "=== Input NSP directory ==="
          ls -lh input_nsp/ || true

      - name: Run build_ipa_from_nsp
        env:
          DM_TEAM_ID: ""
          PYTHONUTF8: "1"
        run: |
          python3 scripts/build_ipa_from_nsp.py input_nsp -k keys/prod.keys --no-heap-check

      - name: Prepare Release Assets (Split if > 2GB)
        if: success()
        run: |
          for f in input_nsp/*.ipa *.ipa; do
            [ -f "$f" ] || continue
            size=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null)
            echo "Checking file $f (size: $size bytes)..."
            if [ "$size" -gt 2000000000 ]; then
              echo "File $f is larger than 2GB ($size bytes), splitting into 1900MB parts..."
              split -b 1900M "$f" "${f}.part"
              rm -f "$f"
              ls -lh "${f}.part"*
            fi
          done

      - name: Create GitHub Release with IPA
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('build-{0}', github.run_number) }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || format('Build {0}', github.run_number) }}
          files: |
            input_nsp/*.ipa
            input_nsp/*.ipa.part*
            *.ipa
            *.ipa.part*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA
          path: |
            input_nsp/*.ipa
            *.ipa

      - name: Upload Debug Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            input_nsp/*_build/logs/
            input_nsp/*_build/extract/*/gl_capture/
